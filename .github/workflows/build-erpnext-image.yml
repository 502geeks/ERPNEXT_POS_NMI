name: Build ERPNext NMI image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/502geeks/erpnext-pos-nmi
  FRAPPE_VERSION: v16.34.0
  ERPNEXT_VERSION: v16.35.0
  FRAPPE_DOCKER_REF: c74f28db98fde650612d02a5353177a9c2df4f34

jobs:
  build:
    name: Build and publish immutable image
    runs-on: ubuntu-latest

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Check out pinned Frappe Docker build tooling
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}
          path: frappe_docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve application ref and image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            APP_REF="${GITHUB_HEAD_REF}"
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            APP_REF="${GITHUB_REF_NAME}"
            PR_NUMBER=""
          fi

          SHA_TAG="sha-${GITHUB_SHA}"
          TAG_ARGS="--tag ${IMAGE_NAME}:${SHA_TAG}"

          if [[ -n "${PR_NUMBER}" ]]; then
            TAG_ARGS+=" --tag ${IMAGE_NAME}:pr-${PR_NUMBER}"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            TAG_ARGS+=" --tag ${IMAGE_NAME}:main"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_ARGS+=" --tag ${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi

          echo "app_ref=${APP_REF}" >> "${GITHUB_OUTPUT}"
          echo "sha_tag=${SHA_TAG}" >> "${GITHUB_OUTPUT}"
          echo "tag_args=${TAG_ARGS}" >> "${GITHUB_OUTPUT}"

      - name: Generate apps.json
        shell: bash
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/apps.json" <<EOF
          [
            {
              "url": "https://github.com/frappe/erpnext",
              "branch": "${ERPNEXT_VERSION}"
            },
            {
              "url": "https://github.com/502geeks/ERPNEXT_POS_NMI",
              "branch": "${{ steps.meta.outputs.app_ref }}"
            }
          ]
          EOF

          cat "${RUNNER_TEMP}/apps.json"

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail

          docker buildx build \
            --platform linux/amd64 \
            --build-arg "FRAPPE_BRANCH=${FRAPPE_VERSION}" \
            --build-arg "CACHE_BUST=${GITHUB_SHA}" \
            --secret "id=apps_json,src=${RUNNER_TEMP}/apps.json" \
            ${{ steps.meta.outputs.tag_args }} \
            --metadata-file "${RUNNER_TEMP}/build-metadata.json" \
            --file frappe_docker/images/custom/Containerfile \
            --push \
            frappe_docker

      - name: Verify published image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_NAME}:${{ steps.meta.outputs.sha_tag }}"
          docker pull "${IMAGE}"

          docker run --rm \
            --entrypoint bash \
            "${IMAGE}" \
            -lc 'cd /home/frappe/frappe-bench && bench version && test -d apps/custom_erp'

      - name: Publish build summary
        shell: bash
        run: |
          set -euo pipefail

          DIGEST="$(jq -r '."containerimage.digest" // empty' "${RUNNER_TEMP}/build-metadata.json")"

          {
            echo "## ERPNext NMI image"
            echo
            echo "- App ref: \`${{ steps.meta.outputs.app_ref }}\`"
            echo "- Frappe: \`${FRAPPE_VERSION}\`"
            echo "- ERPNext: \`${ERPNEXT_VERSION}\`"
            echo "- Image: \`${IMAGE_NAME}:${{ steps.meta.outputs.sha_tag }}\`"
            if [[ -n "${DIGEST}" ]]; then
              echo "- Digest: \`${DIGEST}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
